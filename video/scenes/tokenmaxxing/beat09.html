<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Beat 9 · Tokenmaxxing</title>
<link rel="stylesheet" href="../../theme/neon.css">
<style>
  .lbl { position: absolute; text-align: center; font-weight: 600; white-space: nowrap; }
  .counter { position: absolute; text-align: center; font-weight: 800; line-height: 1; white-space: nowrap; will-change: transform; }
  .cell { position: absolute; border-radius: 0.5em; background: linear-gradient(to top, #B23BE8, #E39BFF 75%, #fff); will-change: transform, opacity; }
  .month { position: absolute; text-align: center; font-weight: 600; white-space: nowrap; }
  .cursor { position: absolute; background: #fff; clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .foot { position: absolute; text-align: center; font-weight: 400; white-space: nowrap; }
</style>
</head>
<body>
<div class="stage"></div>

<script src="../../../engine/gsap.min.js"></script>
<script src="../../lib/scene-runtime.js"></script>
<script src="../../lib/backdrop.js"></script>
<script src="../../lib/components.js"></script>
<script>
/* Beat 9 (1:22–1:32): "Reports के मुताबिक Meta का token खर्च एक ही महीने में 10 करोड़ डॉलर से ऊपर चला गया। और Uber ने अपना पूरे साल
   का AI budget सिर्फ़ चार महीनों में खत्म कर दिया."
   Both figures come from press reports, so the beat carries "* According to reports".
   CUES are seconds from the start of this beat. Placeholder times until the Hindi recording exists. */
const CUES = {
  start: 0.4,        // "Reports के मुताबिक Meta का token खर्च" — the Meta counter starts climbing
  hundredM: 2.4,     // "10 करोड़ डॉलर" — the counter slams to $100M: flare + screen shake
  uber: 4.6,         // "Uber ने अपना पूरे साल का AI budget" — the 12-month budget bar appears
  fourMonths: 7.4,   // "चार महीनों" — the 4th month: the bar is empty, caption lands
};
const DURATION = 10;

registerScene({
  duration: DURATION, fps: 30, seed: 9, cues: CUES,
  build(tl, ctx) {
    const { W, H, u, format, stage } = ctx;
    const isShort = format === "short";
    buildBackdrop(ctx, { duration: DURATION, panels: isShort
      ? [{ x: 0.04, y: 0.06, w: 8, color: "m" }, { x: 0.78, y: 0.07, w: 8, color: "c" }, { x: 0.72, y: 0.86, w: 9, color: "c" }]
      : [{ x: 0.04, y: 0.06, w: 8, color: "m" }, { x: 0.86, y: 0.07, w: 7, color: "c" }, { x: 0.90, y: 0.88, w: 6, color: "c" }] });

    // ---------- Layout per format (one centred column in both) ----------
    const L = isShort
      ? { meta: { y: 0.105 * H, s: 3.4 * u }, num: { y: 0.158 * H, s: 15 * u }, capA: { y: 0.29 * H, s: 5.6 * u },
          uber: { y: 0.385 * H, s: 3.4 * u }, bar: { x: 0.12 * W, w: 0.76 * W, y: 0.43 * H, h: 5 * u }, mon: 2 * u,
          capB: { y: 0.545 * H, s: 6 * u, lines: ["Full-Year Budget", "Gone in 4 Months*"] }, foot: { y: 0.70 * H, s: 2.6 * u } }
      : { meta: { y: 0.04 * H, s: 3.2 * u }, num: { y: 0.1 * H, s: 14 * u }, capA: { y: 0.28 * H, s: 5 * u },
          uber: { y: 0.42 * H, s: 3.2 * u }, bar: { x: 0.2 * W, w: 0.6 * W, y: 0.49 * H, h: 5 * u }, mon: 2.1 * u,
          capB: { y: 0.625 * H, s: 5.4 * u, lines: ["Full-Year Budget Gone in 4 Months*"] }, foot: { y: 0.79 * H, s: 2.6 * u } };
    const cx = W / 2;

    // ---------- Meta: the counter climbs, then slams to $100M ----------
    const grpA = document.createElement("div");                 // wrapper so the "screen shake" moves it as one
    grpA.style.cssText = "position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none";
    stage.appendChild(grpA);
    const meta = document.createElement("div");
    meta.className = "lbl soft-text";
    meta.style.cssText = `left:0;width:${W}px;top:${L.meta.y}px;font-size:${L.meta.s}px;opacity:0`;
    meta.textContent = "Meta · monthly token spend";
    grpA.appendChild(meta);
    const numFlare = createFlare(ctx, { x: cx, y: L.num.y + L.num.s * 0.5, size: 60 * u, color: "magenta" });
    const num = document.createElement("div");
    num.className = "counter neon-text-m";
    num.style.cssText = `left:0;width:${W}px;top:${L.num.y}px;font-size:${L.num.s}px;opacity:0`;
    num.textContent = "$0M";
    grpA.appendChild(num);
    const st = { v: 0 };
    ctx.onFrame(() => { num.textContent = "$" + Math.round(st.v) + "M"; });
    flickerOn(ctx, meta, CUES.start);
    tl.set(num, { opacity: 1 }, CUES.start)
      .to(st, { v: 100, duration: CUES.hundredM - CUES.start, ease: "power3.in" }, CUES.start)
      .fromTo(num, { scale: 1.45, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.25, ease: "power4.out" }, CUES.hundredM);
    numFlare.burst(CUES.hundredM, 1);

    // ---------- Uber: a 12-month budget that is gone by month 4 ----------
    const grpB = document.createElement("div");
    grpB.style.cssText = "position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none";
    stage.appendChild(grpB);
    const uber = document.createElement("div");
    uber.className = "lbl soft-text";
    uber.style.cssText = `left:0;width:${W}px;top:${L.uber.y}px;font-size:${L.uber.s}px;opacity:0`;
    uber.textContent = "Uber · AI budget for the year";
    grpB.appendChild(uber);
    flickerOn(ctx, uber, CUES.uber);

    const B = L.bar, gapC = 0.5 * u, cellW = (B.w - 11 * gapC) / 12;
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const cells = [], labels = [];
    months.forEach((m, i) => {
      const x = B.x + i * (cellW + gapC);
      const c = document.createElement("div");
      c.className = "cell";
      c.style.cssText = `left:${x}px;top:${B.y}px;width:${cellW}px;height:${B.h}px;opacity:0;
        box-shadow:0 0 ${0.5 * u}px #fff, 0 0 ${1.6 * u}px #E39BFF, 0 0 ${3 * u}px #B23BE8`;
      const lab = document.createElement("div");
      lab.className = "month soft-text";
      lab.style.cssText = `left:${x - gapC}px;width:${cellW + 2 * gapC}px;top:${B.y + B.h + 0.9 * u}px;font-size:${L.mon}px;opacity:0`;
      lab.textContent = m;
      grpB.appendChild(c); grpB.appendChild(lab);
      cells.push(c); labels.push(lab);
    });
    tl.fromTo(cells, { opacity: 0, scaleY: 0.3 }, { opacity: 1, scaleY: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.03 }, CUES.uber)
      .to(labels, { opacity: 1, duration: 0.3, stagger: 0.03 }, CUES.uber + 0.1);

    // the cursor walks the first four months; each month burns three months' worth of budget
    const cur = document.createElement("div");
    cur.className = "cursor";
    const curW = 2.4 * u;
    cur.style.cssText = `left:${B.x + cellW / 2 - curW / 2}px;top:${B.y - 2.6 * u}px;width:${curW}px;height:${1.8 * u}px;opacity:0;
      filter:drop-shadow(0 0 ${0.6 * u}px #E39BFF)`;
    grpB.appendChild(cur);
    tl.to(cur, { opacity: 1, duration: 0.2 }, CUES.uber + 0.6);
    for (let m = 1; m <= 4; m++) {
      const t = CUES.fourMonths - (4 - m) * 0.6;
      tl.to(cur, { x: (m - 1) * (cellW + gapC), duration: 0.3, ease: "power2.inOut" }, t - 0.3);
      for (let k = 0; k < 3; k++) {
        tl.to(cells[(m - 1) * 3 + k], { opacity: 0.1, scaleY: 0.45, duration: 0.25, ease: "power2.in" }, t - 0.2 + k * 0.08);
      }
    }
    // month 4: the bar is empty; the months that are left read as unfunded
    tl.to(labels.slice(4), { opacity: 0.35, duration: 0.4 }, CUES.fourMonths)
      .to(labels[3], { color: "#fff", scale: 1.25, duration: 0.2, ease: "power2.out" }, CUES.fourMonths);
    const barFlare = createFlare(ctx, { x: cx, y: B.y + B.h / 2, size: 40 * u, color: "magenta" });
    barFlare.burst(CUES.fourMonths + 0.2, 0.7);

    // ---------- Captions (separate layers, toggle with ?captions=0) ----------
    const capA = createCaption(ctx, { cx, y: L.capA.y, w: 0.76 * W, lines: [{ html: "in One Month*", size: L.capA.s, cls: "soft-text", weight: 800 }] });
    capA.reveal(0, CUES.hundredM + 0.25, 0.5);
    const capB = createCaption(ctx, { cx, y: L.capB.y, w: 0.76 * W, lines: L.capB.lines.map((t) => ({ html: t, size: L.capB.s, cls: "neon-text-m" })) });
    capB.reveal(0, CUES.fourMonths);
    if (L.capB.lines.length > 1) capB.reveal(1, CUES.fourMonths + 0.3);
    const foot = document.createElement("div");
    foot.className = "layer captions";
    foot.innerHTML = `<div class="foot soft-text" style="left:0;width:${W}px;top:${L.foot.y}px;font-size:${L.foot.s}px;opacity:0">* According to reports</div>`;
    stage.appendChild(foot);
    tl.to(foot.firstElementChild, { opacity: 0.8, duration: 0.5 }, CUES.hundredM + 0.6);

    // ---------- Screen shake on the $100M slam (moves the counter, the bar and the captions together) ----------
    const shake = [0, -1.6 * u, 1.3 * u, -0.9 * u, 0.5 * u, 0];
    [grpA, grpB, capA.el, capB.el].forEach((el) => tl.to(el, { keyframes: { x: shake }, duration: 0.4, ease: "none" }, CUES.hundredM));
  },
});
</script>
</body>
</html>
