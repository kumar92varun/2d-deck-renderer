<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Beat 4 · Tokenmaxxing</title>
<link rel="stylesheet" href="../../theme/neon.css">
<style>
  .caption { position: absolute; text-align: center; line-height: 1.15; }
  .caption .l1 { display: block; font-weight: 800; letter-spacing: .01em; }
  .caption .l2 { display: block; font-weight: 600; margin-top: .25em; }
  .badge { position: absolute; display: flex; align-items: center; gap: .5em; font-weight: 600; white-space: nowrap;
           padding: .35em .8em; border-radius: 999px; border: 3px solid #fff; background: rgba(18,10,38,.8); }
</style>
</head>
<body>
<div class="stage"></div>

<script src="../../../engine/gsap.min.js"></script>
<script src="../../lib/scene-runtime.js"></script>
<script src="../../lib/backdrop.js"></script>
<script src="../../lib/components.js"></script>
<script>
/* Beat 4 (0:28–0:40): "Tokenmaxxing मतलब ... 2026 की शुरुआत में चल पड़ा।"
   CUES are seconds from the start of this beat. Replace them with the times from
   your Hindi recording; every animation keyed to a cue moves with it. */
const CUES = {
  tokenmaxxing: 0.7,   // "Tokenmaxxing" — caption slams in
  meter: 1.5,          // meter appears
  y2026: 9.2,          // "2026" — badge pops
};
const DURATION = 12;

registerScene({
  duration: DURATION, fps: 30, seed: 4, cues: CUES,
  build(tl, ctx) {
    const { W, H, u, format, stage } = ctx;
    buildBackdrop(ctx, { duration: DURATION, panels: format === "short"
      ? [{ x: 0.05, y: 0.30, w: 10, color: "m" }, { x: 0.42, y: 0.27, w: 8, color: "c" }, { x: 0.74, y: 0.86, w: 9, color: "c" }]
      : [{ x: 0.40, y: 0.09, w: 8, color: "m" }, { x: 0.64, y: 0.16, w: 7, color: "c" }, { x: 0.82, y: 0.80, w: 8, color: "c" }] });

    // ---------- Layout per format ----------
    const L = format === "short"
      ? { tok: { base: 0.64 * H, size: 16 * u },
          box: { w: 24 * u, h: 22 * u },
          meter: { w: 21 * u, h: 48 * u, x: 0.88 * W - 21 * u, y: 0.11 * H },
          cap: { cx: 0.5 * W, y: 0.685 * H, w: 0.76 * W, s1: 9 * u, s2: 5.6 * u },
          badge: { x: 0.07 * W, y: 0.115 * H, s: 4.2 * u },
          pile: { x: 0.03 * W } }
      : { tok: { base: 0.72 * H, size: 19 * u },
          box: { w: 31 * u, h: 24 * u },
          meter: { w: 21 * u, h: 52 * u, x: 0.94 * W - 21 * u, y: 0.12 * H },
          cap: { cx: 0.5 * W, y: 0.79 * H, w: 0.7 * W, s1: 8.4 * u, s2: 4.8 * u },
          badge: { x: 0.05 * W, y: 0.09 * H, s: 4 * u },
          pile: { x: 0.04 * W } };
    // Tile heap + Tok + box are one cluster centred on the screen (the meter is a corner HUD and stays top-right).
    // In the Short the cluster is capped at 76% of the width to stay out of the right 12% safe zone.
    const ts = 6.4 * u, tw = ts * 1.32, step = tw + 0.8 * u;
    const heapSpan = 3 * step + 1.5 * u;
    const gapTB = format === "short" ? 0.76 * W - (heapSpan + L.tok.size + L.box.w) : 12 * u;
    L.tok.x = (W - (heapSpan + L.tok.size + gapTB + L.box.w)) / 2 + heapSpan;
    L.box.x = L.tok.x + L.tok.size + gapTB;
    L.box.y = L.tok.base - L.box.h;

    // ---------- Actors ----------
    const box = createNeonBox(ctx, { w: L.box.w, h: L.box.h, label: "AI", color: "cyan" });
    gsap.set(box, { left: L.box.x, top: L.box.y, opacity: 0 });

    // A neat pyramid of tiles to the left of Tok (fixed-width tiles so nothing overlaps)
    const heapTexts = ["the", "AI", "ing", "of", "doc", "?"];
    const heap = [];
    const slots = [[0, 0], [1, 0], [2, 0], [0.5, 1], [1.5, 1], [1, 2]];
    const heapX = L.tok.x - 3 * step - 1.5 * u;
    heapTexts.forEach((t, i) => {
      const el = createTile(ctx, { text: t, size: ts });
      el.style.width = tw + "px"; el.style.padding = "0";
      const [col, row] = slots[i];
      gsap.set(el, { left: heapX + col * step, top: L.tok.base - ts - row * (ts + 0.6 * u),
                     rotation: (ctx.rng() - 0.5) * 8, opacity: 0, scale: 0.5 });
      heap.push(el);
    });
    tl.to(heap, { opacity: 0.9, scale: 1, duration: 0.25, ease: "back.out(2)", stagger: 0.03 }, 0.1);

    const tok = createTok(ctx, { size: L.tok.size, color: "magenta" });
    const tokTop = L.tok.base - L.tok.size;
    gsap.set(tok.el, { left: L.tok.x, top: tokTop, y: -0.5 * H });
    tl.to(tok.el, { y: 0, duration: 0.42, ease: "power3.in" }, 0.05);
    tok.squash(0.47, 1.3);
    flickerOn(ctx, box, 0.25);
    [1.0, 4.6, 7.9].forEach((t) => tok.blink(t));

    // ---------- Meter ----------
    const m = createMeter(ctx, { x: L.meter.x, y: L.meter.y, w: L.meter.w, h: L.meter.h });
    tl.fromTo(m.el, { x: 12 * u, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, CUES.meter);
    tl.set(m.valueGlow, { opacity: 0.12 }, 0);

    // ---------- The throwing loop: accelerating, non-stop ----------
    const tileTexts = ["Hi", "to", "ken", "the", "pro", "mpt", "act", "ion", "s", "PR", "doc", "ref", "of", "?", "ing", "max", "xx", "AI", "yes", "ok", "fix", "bug", "run", "re", "try", "was", "json", "</>", "lo", "gs"];
    const throws = [];
    let t = CUES.meter + 0.45, gap = 0.85;
    while (t < DURATION - 1.2) { throws.push(t); t += gap; gap = Math.max(0.2, gap * 0.88); }
    const N = throws.length;

    const fromX = L.tok.x + L.tok.size * 0.5, fromY = tokTop - ts * 0.2;
    const toX = L.box.x + L.box.w * 0.5, toY = L.box.y + L.box.h * 0.35;
    const trackRect = { // centre of the Tokens bar's bottom, in stage coords
      x: L.meter.x + L.meter.w * 0.17, y: L.meter.y + L.meter.h * 0.86 };

    const state = { tokens: 0, value: 0 };
    throws.forEach((t0, k) => {
      const p = k / Math.max(1, N - 1);           // 0 → 1 as Tok speeds up
      const d = 0.55 - 0.17 * p;                  // flight time shrinks
      tok.squash(t0 - 0.12, 0.6 + 0.8 * p);

      const tile = createTile(ctx, { text: tileTexts[k % tileTexts.length], size: ts });
      gsap.set(tile, { left: 0, top: 0, x: fromX - ts / 2, y: fromY, opacity: 0, scale: 0.3 });
      const apex = Math.min(fromY, toY) - (format === "short" ? 0.12 : 0.18) * H;
      tl.to(tile, { opacity: 1, scale: 1, duration: 0.1, ease: "back.out(3)" }, t0 - 0.1)
        .to(tile, { x: toX - ts / 2, duration: d, ease: "none" }, t0)
        .to(tile, { y: apex, duration: d * 0.5, ease: "power2.out" }, t0)
        .to(tile, { y: toY, duration: d * 0.5, ease: "power2.in" }, t0 + d * 0.5)
        .to(tile, { rotation: (k % 2 ? 1 : -1) * (200 + 160 * p), duration: d, ease: "none" }, t0)
        .to(tile, { scale: 0.15, opacity: 0, duration: 0.1, ease: "power2.in" }, t0 + d);

      // The box gulps it
      tl.to(box, { scaleX: 1.07, scaleY: 0.94, duration: 0.06, ease: "power2.out" }, t0 + d)
        .to(box, { scaleX: 1, scaleY: 1, duration: 0.25, ease: "elastic.out(1,0.4)" }, t0 + d + 0.06);

      // A cost coin flies from the box into the Tokens bar
      const coin = document.createElement("div");
      const cs = 3.4 * u;
      coin.style.cssText = `position:absolute;left:0;top:0;width:${cs}px;height:${cs}px;border-radius:50%;
        background:radial-gradient(circle at 35% 35%, #fff, #E39BFF 45%, #B23BE8);
        box-shadow:0 0 ${0.6 * u}px #fff, 0 0 ${2 * u}px #E39BFF, 0 0 ${4 * u}px #B23BE8;opacity:0`;
      stage.appendChild(coin);
      const ct = t0 + d + 0.04, cd = 0.34;
      tl.set(coin, { x: toX - cs / 2, y: L.box.y - cs * 0.3, opacity: 1, scale: 0.6 }, ct)
        .to(coin, { x: trackRect.x - cs / 2, duration: cd, ease: "power1.inOut" }, ct)
        .to(coin, { y: trackRect.y - cs / 2, duration: cd, ease: "back.in(1.4)" }, ct)
        .to(coin, { scale: 1, duration: cd * 0.4 }, ct)
        .to(coin, { opacity: 0, scale: 0.4, duration: 0.08 }, ct + cd);

      // Tokens bar steps up with each coin; the count grows fast (Indian digit grouping)
      const hit = ct + cd;
      const level = 0.97 * (k + 1) / N;
      tl.to(m.tokensFill, { scaleY: level, duration: 0.18, ease: "back.out(2)" }, hit)
        .to(m.tokensGlow, { opacity: 0.4 + 0.6 * p, scaleY: 0.4 + 0.8 * level, duration: 0.18 }, hit)
        .to(state, { tokens: Math.round(2400 * Math.pow(1.34, k)), duration: 0.18, ease: "power1.out" }, hit);

      // Value barely moves: a tiny nudge every 8th tile
      if (k % 8 === 7) tl.to(m.valueFill, { scaleY: "+=0.025", duration: 0.3, ease: "power1.out" }, hit)
                         .to(state, { value: "+=1", duration: 0.3 }, hit);
    });

    // Ceiling: the Tokens bar maxes out — flare + shake
    const last = throws[N - 1] + 0.55 - 0.17 + 0.38;
    const topFlare = createFlare(ctx, { x: trackRect.x, y: L.meter.y + L.meter.h * 0.16, size: 22 * u, color: "magenta" });
    topFlare.burst(last, 1);
    tl.to(m.el, { keyframes: { x: [0, -1.2 * u, 1.0 * u, -0.7 * u, 0.4 * u, 0] }, duration: 0.35, ease: "none" }, last);

    ctx.onFrame(() => {
      m.tokensNum.textContent = Math.round(state.tokens).toLocaleString("en-IN");
      m.valueNum.textContent = "+" + Math.round(state.value) + "%";
    });

    // ---------- Caption (separate layer, toggle with ?captions=0) ----------
    const cap = document.createElement("div");
    cap.className = "layer captions";
    cap.innerHTML = `
      <div class="caption" style="left:${L.cap.cx - L.cap.w / 2}px;top:${L.cap.y}px;width:${L.cap.w}px">
        <span class="l1 neon-text-m" style="font-size:${L.cap.s1}px">Tokenmaxxing</span>
        <span class="l2 soft-text" style="font-size:${L.cap.s2}px">= <span class="neon-text-m">Usage</span> as <span class="neon-text-m">Score</span></span>
      </div>`;
    stage.appendChild(cap);
    const l1 = cap.querySelector(".l1"), l2 = cap.querySelector(".l2");
    const capFlare = createFlare(ctx, { x: L.cap.cx, y: L.cap.y + L.cap.s1 * 0.6, size: 46 * u, color: "magenta" });
    cap.appendChild(capFlare.el); capFlare.el.style.zIndex = -1;
    tl.fromTo(l1, { opacity: 0, scale: 1.45 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power4.out" }, CUES.tokenmaxxing);
    capFlare.burst(CUES.tokenmaxxing, 0.8);
    tl.fromTo(l2, { opacity: 0, y: 3 * u }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, CUES.tokenmaxxing + 0.35);

    // ---------- 2026 badge ----------
    const badge = document.createElement("div");
    badge.className = "badge";
    badge.style.cssText += `left:${L.badge.x}px;top:${L.badge.y}px;font-size:${L.badge.s}px;opacity:0;
      box-shadow:0 0 ${0.6 * u}px #fff, 0 0 ${2 * u}px #B4F7FF, 0 0 ${4.5 * u}px #36D6E7`;
    badge.innerHTML = `<span class="soft-text">Silicon Valley</span><span class="neon-text-c" style="font-weight:800">2026</span>`;
    cap.appendChild(badge);
    const bFlare = createFlare(ctx, { x: L.badge.x + 18 * u, y: L.badge.y + 3 * u, size: 30 * u, color: "cyan" });
    cap.insertBefore(bFlare.el, badge);
    tl.fromTo(badge, { opacity: 0, scale: 0.6, transformOrigin: "0% 50%" },
                     { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, CUES.y2026);
    bFlare.burst(CUES.y2026, 0.9);
  },
});
</script>
</body>
</html>
