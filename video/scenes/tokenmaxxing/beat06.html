<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Beat 6 · Tokenmaxxing</title>
<link rel="stylesheet" href="../../theme/neon.css">
<style>
  .neon-text-l { color: #fff;
    text-shadow: 0 0 calc(var(--u)*.15) #fff, 0 0 calc(var(--u)*.7) #B6B2FF, 0 0 calc(var(--u)*2) #6E6BD6, 0 0 calc(var(--u)*4) #6E6BD6b3; }
  .caption { position: absolute; text-align: center; line-height: 1.15; font-weight: 800; white-space: nowrap; letter-spacing: .01em; }
  .caption .seg { opacity: 0; }
  .qcard { position: absolute; display: flex; flex-direction: column; justify-content: center; }
  .qcard .quote { font-weight: 600; line-height: 1.3; }
  .qcard .hl { display: inline-block; }
  .qcard .who { font-weight: 800; letter-spacing: .02em; }
  .qcard .note { font-weight: 400; opacity: .75; }
  .bar-label { position: absolute; font-weight: 600; white-space: nowrap; }
  .track { position: absolute; overflow: hidden; background: rgba(18,10,38,.5); border: 2px solid rgba(255,255,255,.2); }
  .fill { position: absolute; transform-origin: 0 50%; transform: scaleX(0); }
</style>
</head>
<body>
<div class="stage"></div>

<script src="../../../engine/gsap.min.js"></script>
<script src="../../lib/scene-runtime.js"></script>
<script src="../../lib/backdrop.js"></script>
<script src="../../lib/components.js"></script>
<script>
/* Beat 6 (0:50–1:00): "बड़े-बड़े नाम इसके साथ थे। Nvidia के Jensen Huang ने कहा कि अगर आपका पाँच लाख डॉलर वाला engineer
   ढाई लाख डॉलर के tokens नहीं जला रहा, तो कुछ गड़बड़ है।"
   The card text is a PARAPHRASE of what AP reported, shown without quotation marks and labelled as such.
   CUES are seconds from the start of this beat. Placeholder times until the Hindi recording exists. */
const CUES = {
  card: 0.3,       // "बड़े-बड़े नाम इसके साथ थे" — the quote card appears
  speaker: 2.6,    // "Nvidia के Jensen Huang" — the attribution lands
  salary: 4.6,     // "पाँच लाख डॉलर वाला engineer" — salary bar fills, "$500K Salary" caption
  tokens: 6.4,     // "ढाई लाख डॉलर के tokens" — tokens bar fills to half, "vs $250K Tokens" caption, flare
};
const DURATION = 10;

registerScene({
  duration: DURATION, fps: 30, seed: 6, cues: CUES,
  build(tl, ctx) {
    const { W, H, u, format, stage } = ctx;
    const isShort = format === "short";
    buildBackdrop(ctx, { duration: DURATION, panels: isShort
      ? [{ x: 0.04, y: 0.075, w: 8, color: "m" }, { x: 0.78, y: 0.085, w: 8, color: "c" }, { x: 0.70, y: 0.84, w: 9, color: "c" }]
      : [{ x: 0.04, y: 0.07, w: 8, color: "m" }, { x: 0.87, y: 0.08, w: 7, color: "c" }, { x: 0.90, y: 0.88, w: 6, color: "c" }] });

    // ---------- Layout per format (everything centred on the screen) ----------
    const L = isShort
      ? { card: { x: 0.12 * W, y: 0.15 * H, w: 0.76 * W, h: 36 * u }, q: 4.2 * u,
          bars: { x: 0.12 * W, w: 0.76 * W, y0: 0.385 * H, pitch: 11 * u, h: 4.2 * u },
          cap: { cx: 0.5 * W, y: 0.605 * H, s: 6.8 * u } }
      : { card: { x: 0.2 * W, y: 0.08 * H, w: 0.6 * W, h: 29 * u }, q: 4.4 * u,
          bars: { x: 0.2 * W, w: 0.6 * W, y0: 0.43 * H, pitch: 13 * u, h: 4.4 * u },
          cap: { cx: 0.5 * W, y: 0.72 * H, s: 6.4 * u } };
    const pad = 2.6 * u;

    // ---------- Quote card ----------
    const card = document.createElement("div");
    card.className = "qcard";
    card.style.cssText = `left:${L.card.x}px;top:${L.card.y}px;width:${L.card.w}px;height:${L.card.h}px;padding:${pad}px;gap:${2.4 * u}px;border-radius:${1.8 * u}px;
      border:${0.4 * u}px solid #fff;background:linear-gradient(160deg, rgba(34,20,70,.92), rgba(14,8,32,.94));
      box-shadow:0 0 ${0.5 * u}px #fff, 0 0 ${1.6 * u}px #B6B2FF, 0 0 ${4 * u}px #6E6BD6, inset 0 0 ${3 * u}px rgba(110,107,214,.45);will-change:transform,opacity`;
    card.innerHTML = `
      <div class="quote soft-text" style="font-size:${L.q}px">If your <span class="hl hl1 neon-text-l">$500K engineer</span> isn&rsquo;t burning
        <span class="hl hl2 neon-text-m">$250K worth of tokens</span>, something is wrong.</div>
      <div style="opacity:0" class="attr">
        <div class="who neon-text-l" style="font-size:${2.9 * u}px">Jensen Huang, Nvidia</div>
        <div class="note soft-text" style="font-size:${1.9 * u}px;margin-top:.3em">Paraphrased from AP reporting</div>
      </div>`;
    stage.appendChild(card);
    flickerOn(ctx, card, CUES.card);
    tl.fromTo(card, { y: 4 * u }, { y: 0, duration: 0.5, ease: "power3.out" }, CUES.card);
    const attr = card.querySelector(".attr");
    tl.fromTo(attr, { opacity: 0, x: -2 * u }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, CUES.speaker);

    // ---------- The two bars: salary vs tokens, on the same scale ----------
    const B = L.bars, inset = 0.35 * u, innerW = B.w - 2 * inset - 4;
    const rows = [
      { label: "Engineer salary", frac: 1.0, grad: "linear-gradient(90deg, #6E6BD6, #B6B2FF 70%, #fff)", glow: "#B6B2FF", glow2: "#6E6BD6", at: CUES.salary },
      { label: "Token spend",    frac: 0.5, grad: "linear-gradient(90deg, #B23BE8, #E39BFF 70%, #fff)", glow: "#E39BFF", glow2: "#B23BE8", at: CUES.tokens },
    ];
    const fills = rows.map((r, i) => {
      const top = B.y0 + i * B.pitch;
      const lab = document.createElement("div");
      lab.className = "bar-label soft-text";
      lab.style.cssText = `left:${B.x + 0.6 * u}px;top:${top}px;font-size:${3 * u}px`;
      lab.textContent = r.label;
      const track = document.createElement("div");
      track.className = "track";
      track.style.cssText = `left:${B.x}px;top:${top + 4 * u}px;width:${B.w}px;height:${B.h}px;border-radius:${B.h / 2}px`;
      const fill = document.createElement("div");
      fill.className = "fill";
      fill.style.cssText = `left:${inset}px;top:${inset}px;height:${B.h - 2 * inset - 4}px;width:${innerW * r.frac}px;border-radius:${B.h / 2}px;background:${r.grad};
        box-shadow:0 0 ${0.8 * u}px #fff, 0 0 ${1.5 * u}px ${r.glow}, 0 0 ${3 * u}px ${r.glow2}`;
      track.appendChild(fill);
      stage.appendChild(lab); stage.appendChild(track);
      flickerOn(ctx, lab, CUES.card + 0.4 + i * 0.15);
      flickerOn(ctx, track, CUES.card + 0.4 + i * 0.15);
      return { fill, r, top };
    });

    // Each bar fills on its own cue; a flare bursts at the tip of the token bar
    const tokenTip = { x: B.x + inset + 2 + innerW * 0.5, y: fills[1].top + 4 * u + B.h / 2 };
    const tipFlare = createFlare(ctx, { x: tokenTip.x, y: tokenTip.y, size: 26 * u, color: "magenta" });
    fills.forEach(({ fill, r }) => tl.to(fill, { scaleX: 1, duration: 0.7, ease: "power3.out" }, r.at));
    tipFlare.burst(CUES.tokens + 0.55, 1);
    // The card's highlighted words pop as they are spoken
    const pop = (sel, at) => tl.to(card.querySelector(sel), { scale: 1.12, duration: 0.1, ease: "power2.out" }, at)
                                .to(card.querySelector(sel), { scale: 1, duration: 0.35, ease: "elastic.out(1,0.5)" }, at + 0.1);
    pop(".hl1", CUES.salary);
    pop(".hl2", CUES.tokens);

    // ---------- Caption (separate layer, toggle with ?captions=0) ----------
    const cap = document.createElement("div");
    cap.className = "layer captions";
    const seg = isShort ? "display:block" : "display:inline-block;margin:0 .25em";
    cap.innerHTML = `
      <div class="caption" style="left:${L.cap.cx - W / 2}px;width:${W}px;top:${L.cap.y}px;font-size:${L.cap.s}px">
        <span class="seg s1 soft-text" style="${seg}">$500K Salary</span><span class="seg s2" style="${seg}"><span class="soft-text">vs</span> <span class="neon-text-m">$250K Tokens</span></span>
      </div>`;
    stage.appendChild(cap);
    const s1 = cap.querySelector(".s1"), s2 = cap.querySelector(".s2");
    const capFlare = createFlare(ctx, { x: L.cap.cx, y: L.cap.y + L.cap.s * (isShort ? 1.1 : 0.6), size: 46 * u, color: "magenta" });
    cap.appendChild(capFlare.el); capFlare.el.style.zIndex = -1;
    tl.fromTo(s1, { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.out" }, CUES.salary);
    tl.fromTo(s2, { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.out" }, CUES.tokens);
    capFlare.burst(CUES.tokens, 0.8);
  },
});
</script>
</body>
</html>
