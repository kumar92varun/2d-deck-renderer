<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Beat 3 · Tokenmaxxing</title>
<link rel="stylesheet" href="../../theme/neon.css">
<style>
  .caption { position: absolute; text-align: center; line-height: 1.2; white-space: nowrap; font-weight: 800; }
  .caption .part { opacity: 0; }
  .pill { display: inline-block; font-weight: 600; white-space: nowrap; border-radius: 999px; border: 3px solid #fff;
          background: rgba(18,10,38,.7); }
</style>
</head>
<body>
<div class="stage"></div>

<script src="../../../engine/gsap.min.js"></script>
<script src="../../lib/scene-runtime.js"></script>
<script src="../../lib/backdrop.js"></script>
<script src="../../lib/components.js"></script>
<script>
/* Beat 3 (0:16–0:38, Take 2): "चलो, सबसे पहले समझते हैं कि tokens होते क्या हैं। जब भी हम AI से chat करते हैं, तो AI हमारे words को
   छोटे-छोटे parts में बाँटता है, जिन्हें हम tokens कहते हैं। एक token, एक English word का लगभग ¾ होता है। हर token: जो हम AI में
   input करते हैं, या AI हमें output देता है। उस हर एक token का पैसा लगता है।"
   CUES are seconds from the start of this beat, measured from Varun's recording with tools/cue-times.mjs. Scene time 0 is
   0.5 s before he starts speaking and the scene ends 0.5 s after he stops; he trims the extra silence in the editor.
 */
const CUES = {
  title: 0.5,           // "चलो, सबसे पहले समझते हैं कि tokens होते क्या हैं" — "What is a token?" title (speech 0.5–2.9)
  sentence: 3.8,        // "जब भी हम AI से chat करते हैं" (AI 3.81) — the prompt appears
  tokens: 7.6,          // "बाँटता" 7.61 — the sentence shatters into tiles ("parts")
  named: 9.14,          // "tokens" 9.14 — the tiles pulse and are named "Tokens"
  box: 10.4,            // "एक token" 10.69 — the AI box lights up
  threeQuarters: 13.4,  // "¾" 13.39 — "1 token ≈ ¾ word" caption
  in: 16.6,             // "input" 16.61 — tiles stream into the AI box, a coin drops for each
  out: 18.15,           // "output" 18.16 — new tiles stream out, a coin drops for each
  cost: 20.9,           // "पैसा" 20.92 — "= Cost" lands, the coins pulse
};
const DURATION = 22.3;

registerScene({
  duration: DURATION, fps: 30, seed: 3, cues: CUES,
  build(tl, ctx) {
    const { W, H, u, format, stage } = ctx;
    buildBackdrop(ctx, { duration: DURATION, panels: format === "short"
      ? [{ x: 0.04, y: 0.075, w: 8, color: "m" }, { x: 0.80, y: 0.09, w: 8, color: "c" }, { x: 0.68, y: 0.85, w: 9, color: "c" }]
      : [{ x: 0.04, y: 0.07, w: 8, color: "m" }, { x: 0.87, y: 0.08, w: 7, color: "c" }, { x: 0.90, y: 0.88, w: 6, color: "c" }] });

    // ---------- Layout per format ----------
    const L = format === "short"
      ? { ts: 7 * u, row: { cx: 0.5 * W, y: 0.20 * H }, sent: 5.2 * u,
          cap1: { cx: 0.5 * W, y: 0.305 * H, s: 5.4 * u },
          base: 0.55 * H,
          box: { w: 26 * u, h: 20 * u },
          out: { cols: 2 },
          coin: { y: 0.605 * H },
          cap2: { cx: 0.5 * W, y: 0.675 * H, s: 6.2 * u } }
      : { ts: 7 * u, row: { cx: 0.5 * W, y: 0.17 * H }, sent: 5.4 * u,
          cap1: { cx: 0.5 * W, y: 0.265 * H, s: 4.8 * u },
          base: 0.68 * H,
          box: { w: 29 * u, h: 22 * u },
          out: { cols: 3 },
          coin: { y: 0.735 * H },
          cap2: { cx: 0.5 * W, y: 0.815 * H, s: 5.4 * u } };
    const ts = L.ts, tw = ts * 1.32, base = L.base;
    // The AI box + reply grid are laid out as one cluster centred on the screen.
    // In the Short the cluster is capped at 76% of the width so it stays out of the right 12% safe zone.
    const outStep = tw + 0.8 * u, gridW = (L.out.cols - 1) * outStep + tw;
    const g = 9.3 * u;
    L.box.x = (W - (L.box.w + gridW + g)) / 2;
    L.out.x0 = L.box.x + L.box.w + g;
    L.box.y = base - L.box.h;
    const boxCx = L.box.x + L.box.w / 2;

    // ---------- Title over the first sentence ----------
    const title = createCaption(ctx, { cx: W / 2, y: (format === "short" ? 0.2 : 0.17) * H, w: 0.76 * W, lines: [
      { html: "What is a token?", size: (format === "short" ? 7 : 6.4) * u, cls: "neon-text-m" } ], flare: "magenta" });
    title.reveal(0, CUES.title);
    tl.to(title.el, { opacity: 0, duration: 0.4, ease: "power2.in" }, CUES.sentence - 0.6);

    // ---------- The prompt (a chat-style pill) that will shatter ----------
    const shatterFlare = createFlare(ctx, { x: L.row.cx, y: L.row.y, size: 46 * u, color: "magenta" });
    const sentWrap = document.createElement("div");
    sentWrap.style.cssText = `position:absolute;left:${L.row.cx - W / 2}px;width:${W}px;top:${L.row.y - L.sent * 1.1}px;text-align:center;will-change:transform,opacity`;
    sentWrap.innerHTML = `<span class="pill soft-text" style="font-size:${L.sent}px;padding:${L.sent * 0.35}px ${L.sent * 0.8}px;
      box-shadow:0 0 ${0.6 * u}px #fff, 0 0 ${1.2 * u}px #E39BFF, 0 0 ${2.6 * u}px #B23BE8">Summarize this doc for me</span>`;
    stage.appendChild(sentWrap);
    const pill = sentWrap.firstElementChild;
    flickerOn(ctx, pill, CUES.sentence);
    tl.fromTo(sentWrap, { y: 3 * u }, { y: 0, duration: 0.4, ease: "power3.out" }, CUES.sentence);
    // the prompt sits on screen for ~5 s: it breathes, then trembles harder as "tokens" approaches
    tl.to(pill, { scale: 1.025, duration: (CUES.tokens - 0.2 - CUES.sentence - 0.6) / 4, ease: "sine.inOut", yoyo: true, repeat: 3 }, CUES.sentence + 0.6);
    for (let k = 0; k < 8; k++) tl.to(pill, { x: (k % 2 ? -1 : 1) * (0.2 + k * 0.12) * u, duration: 0.07, ease: "none" }, CUES.tokens - 1.0 + k * 0.1);
    tl.set(pill, { x: 0 }, CUES.tokens - 0.15);
    tl.to(pill, { scale: 1.07, duration: 0.08, ease: "power2.out" }, CUES.tokens - 0.08)
      .to(pill, { opacity: 0, scale: 1.2, duration: 0.12, ease: "power2.in" }, CUES.tokens);
    shatterFlare.burst(CUES.tokens, 0.9);

    // ---------- Box ----------
    const box = createNeonBox(ctx, { w: L.box.w, h: L.box.h, label: "AI", color: "cyan" });
    gsap.set(box, { left: L.box.x, top: L.box.y });
    flickerOn(ctx, box, CUES.box);

    // ---------- Tiles: the pieces of the prompt ----------
    const pieces = ["Sum", "mar", "ize", "this", "doc", "for", "me"];
    const widths = pieces.map((p) => ts * (0.5 + 0.27 * p.length));
    const gap = 0.9 * u, total = widths.reduce((a, b) => a + b, 0) + gap * (pieces.length - 1);
    const rowTop = L.row.y - ts / 2;
    const tiles = [], lefts = [];
    let cursor = L.row.cx - total / 2;
    pieces.forEach((p, i) => {
      const el = createTile(ctx, { text: p, size: ts });
      el.style.width = widths[i] + "px"; el.style.padding = "0";
      gsap.set(el, { left: cursor, top: rowTop });
      lefts.push(cursor); tiles.push(el);
      cursor += widths[i] + gap;
    });
    const tileCx = (i) => lefts[i] + widths[i] / 2;
    // Burst out from the middle of the old pill into the row
    tiles.forEach((el, i) => {
      tl.fromTo(el, { x: L.row.cx - tileCx(i), scale: 0.3, opacity: 0, rotation: (ctx.rng() - 0.5) * 50 },
                    { x: 0, scale: 1, opacity: 1, rotation: (ctx.rng() - 0.5) * 5, duration: 0.45, ease: "back.out(1.7)" }, CUES.tokens + 0.04 * i);
    });

    // ---------- Coin row (one coin per token, in then out) ----------
    const inIdx = [0, 1, 2, 3, 4, 5, 6];                          // every tile of the prompt
    const outTexts = ["Here", "is", "the", "gist", "!"];
    const N = inIdx.length + outTexts.length;
    const cs = 3.4 * u, cstep = 4.1 * u, coinLeft = W / 2 - (N * cstep) / 2 + (cstep - cs) / 2;
    const coinPos = (k) => ({ x: coinLeft + k * cstep, y: L.coin.y - cs / 2 });
    const coins = [];
    const dropCoin = (k, fromX, fromY, at) => {
      const coin = document.createElement("div");
      coin.style.cssText = `position:absolute;left:0;top:0;width:${cs}px;height:${cs}px;border-radius:50%;
        background:radial-gradient(circle at 35% 35%, #fff, #E39BFF 45%, #B23BE8);
        box-shadow:0 0 ${0.6 * u}px #fff, 0 0 ${1.4 * u}px #E39BFF, 0 0 ${3 * u}px #B23BE8;opacity:0;will-change:transform`;
      stage.appendChild(coin); coins.push(coin);
      const p = coinPos(k), cd = 0.4;
      tl.set(coin, { x: fromX - cs / 2, y: fromY - cs / 2, opacity: 1, scale: 0.6 }, at)
        .to(coin, { x: p.x, duration: cd, ease: "power1.inOut" }, at)
        .to(coin, { y: p.y, duration: cd, ease: "bounce.out" }, at)
        .to(coin, { scale: 1, duration: cd * 0.4 }, at);
    };
    const gulp = (at) => tl.to(box, { scaleX: 1.07, scaleY: 0.94, duration: 0.06, ease: "power2.out" }, at)
                           .to(box, { scaleX: 1, scaleY: 1, duration: 0.25, ease: "elastic.out(1,0.4)" }, at + 0.06);

    // ---------- IN: the prompt's tokens stream into the box ----------
    const entryY = L.box.y + L.box.h * 0.3;
    inIdx.forEach((i, k) => {
      const t0 = CUES.in + k * 0.17, d = 0.5;
      tl.to(tiles[i], { x: boxCx - tileCx(i), duration: d, ease: "power1.inOut" }, t0)
        .to(tiles[i], { y: entryY - ts / 2 - rowTop, duration: d, ease: "power2.in" }, t0)
        .to(tiles[i], { rotation: (k % 2 ? 1 : -1) * 25, duration: d, ease: "none" }, t0)
        .to(tiles[i], { scale: 0.15, opacity: 0, duration: 0.1, ease: "power2.in" }, t0 + d);
      gulp(t0 + d);
      dropCoin(k, boxCx, L.box.y + L.box.h * 0.75, t0 + d + 0.04);
    });

    // ---------- OUT: new tokens stream out of the box ----------
    outTexts.forEach((txt, k) => {
      const t0 = CUES.out + k * 0.14, d = 0.5;
      const el = createTile(ctx, { text: txt, size: ts });
      el.style.width = tw + "px"; el.style.padding = "0";
      const col = k % L.out.cols, row = Math.floor(k / L.out.cols);
      const rows = Math.ceil(outTexts.length / L.out.cols);        // first word on the top row, reads left-to-right, top-to-bottom
      const dstX = L.out.x0 + col * outStep, dstY = base - ts - (rows - 1 - row) * (ts + 0.6 * u);
      const srcX = L.box.x + L.box.w * 0.6 - tw / 2, srcY = L.box.y + L.box.h * 0.4 - ts / 2;
      const apex = Math.min(srcY, dstY) - 0.07 * H;
      gsap.set(el, { left: 0, top: 0, x: srcX, y: srcY, opacity: 0, scale: 0.3 });
      tl.to(el, { opacity: 1, scale: 1, duration: 0.1, ease: "back.out(3)" }, t0)
        .to(el, { x: dstX, duration: d, ease: "power1.out" }, t0)
        .to(el, { y: apex, duration: d * 0.45, ease: "power2.out" }, t0)
        .to(el, { y: dstY, duration: d * 0.55, ease: "bounce.out" }, t0 + d * 0.45);
      gulp(t0);
      dropCoin(inIdx.length + k, L.box.x + L.box.w * 0.6, L.box.y + L.box.h * 0.75, t0 + 0.12);
    });

    // ---------- Captions (separate layer, toggle with ?captions=0) ----------
    const cap = document.createElement("div");
    cap.className = "layer captions";
    cap.innerHTML = `
      <div class="caption cap1" style="left:${L.cap1.cx - W / 2}px;width:${W}px;top:${L.cap1.y}px;font-size:${L.cap1.s}px;opacity:0">
        <span class="neon-text-m">1 token</span> <span class="soft-text">≈ ¾ word</span>
      </div>
      <div class="caption cap2" style="left:${L.cap2.cx - W / 2}px;width:${W}px;top:${L.cap2.y}px;font-size:${L.cap2.s}px">
        <span class="part p1 neon-text-m">Input</span>
        <span class="part p2 soft-text">+</span> <span class="part p2 neon-text-m">Output</span>
        <span class="part p3 soft-text">=</span> <span class="part p3 neon-text-m">Cost</span>
      </div>`;
    stage.appendChild(cap);
    const cap1 = cap.querySelector(".cap1");
    tl.fromTo(cap1, { opacity: 0, y: 3 * u }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, CUES.threeQuarters)
      .to(cap1, { opacity: 0, duration: 0.25 }, CUES.in - 0.3);
    const cap1Flare = createFlare(ctx, { x: L.cap1.cx, y: L.cap1.y + L.cap1.s * 0.6, size: 36 * u, color: "magenta" });
    cap.insertBefore(cap1Flare.el, cap.firstChild);
    cap1Flare.burst(CUES.threeQuarters, 0.6);

    const reveal = (sel, at) => {
      const parts = cap.querySelectorAll(sel);
      tl.fromTo(parts, { opacity: 0, y: 2 * u, scale: 1.25 }, { opacity: 1, y: 0, scale: 1, duration: 0.22, ease: "power3.out", stagger: 0.08 }, at);
    };
    // "tokens" is named: the tiles pulse and a label sits where the ¾ caption comes later
    const nameCap = createCaption(ctx, { cx: L.cap1.cx, y: L.cap1.y, w: 0.76 * W, lines: [
      { html: "Tokens", size: L.cap1.s * 1.1, cls: "neon-text-m" } ], flare: "magenta" });
    nameCap.reveal(0, CUES.named);
    tl.to(nameCap.el, { opacity: 0, duration: 0.3 }, CUES.box + 1.6);
    tl.to(tiles, { scale: 1.12, duration: 0.14, ease: "power2.out", stagger: 0.04 }, CUES.named)
      .to(tiles, { scale: 1, duration: 0.3, ease: "elastic.out(1,0.5)", stagger: 0.04 }, CUES.named + 0.14);
    reveal(".p1", CUES.in);
    reveal(".p2", CUES.out);
    reveal(".p3", CUES.cost);
    const costFlare = createFlare(ctx, { x: L.cap2.cx, y: L.cap2.y + L.cap2.s * 0.6, size: 46 * u, color: "magenta" });
    cap.insertBefore(costFlare.el, cap.firstChild);
    costFlare.burst(CUES.cost, 0.9);
    // all the coins pulse together when the total is named
    tl.to(coins, { scale: 1.25, duration: 0.12, ease: "power2.out", stagger: 0.02 }, CUES.cost)
      .to(coins, { scale: 1, duration: 0.3, ease: "elastic.out(1,0.5)", stagger: 0.02 }, CUES.cost + 0.12);
  },
});
</script>
</body>
</html>
